<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Ngàn Lời Tri Ân 20/11 – Tập Thể TU1E Kính Gửi Thầy Trịnh Văn Sỹ</title>
  <!-- Google Fonts hỗ trợ tiếng Việt đầy đủ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Lớp hiệu ứng cánh hoa rơi 3D -->
  <canvas id="petalCanvas" aria-hidden="true"></canvas>

  <!-- Nút bật/tắt nhạc nền "Người Gieo Mầm Xanh" nhỏ gọn góc trên phải -->
  <button type="button" class="music-floating-btn" id="musicToggleBtn" aria-label="Bật hoặc tắt nhạc nền Người Gieo Mầm Xanh">
    <span class="music-disc" id="musicDisc">🎵</span>
    <span class="music-label" id="musicLabel">Người Gieo Mầm Xanh</span>
  </button>

  <!-- Thẻ audio dự phòng nếu có file mp3 trong thư mục -->
  <audio id="bgAudioElement" preload="auto" loop></audio>

  <!-- Hoa lá trang trí 3D nổi ở góc màn hình -->
  <div class="ambient-florals" aria-hidden="true">
    <div class="corner-floral top-left">
      <svg viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 180 C40 120, 90 60, 190 20" stroke="#88b06a" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
        <path d="M45 135 C20 110, 15 80, 40 70 C60 85, 60 115, 45 135 Z" fill="#a3c585" opacity="0.5"/>
        <path d="M95 85 C115 60, 145 55, 155 75 C140 95, 115 95, 95 85 Z" fill="#8fb973" opacity="0.5"/>
        <g transform="translate(65, 65)">
          <circle cx="0" cy="-22" r="20" fill="#f8bbd0" opacity="0.85"/>
          <circle cx="21" cy="-7" r="20" fill="#f48fb1" opacity="0.85"/>
          <circle cx="13" cy="18" r="20" fill="#f8bbd0" opacity="0.85"/>
          <circle cx="-13" cy="18" r="20" fill="#f48fb1" opacity="0.85"/>
          <circle cx="-21" cy="-7" r="20" fill="#fce4ec" opacity="0.9"/>
          <circle cx="0" cy="0" r="10" fill="#ffe082"/>
        </g>
        <g transform="translate(145, 38) scale(0.65)">
          <circle cx="0" cy="-20" r="18" fill="#fce4ec" opacity="0.9"/>
          <circle cx="19" cy="-6" r="18" fill="#f8bbd0" opacity="0.9"/>
          <circle cx="12" cy="16" r="18" fill="#f48fb1" opacity="0.9"/>
          <circle cx="-12" cy="16" r="18" fill="#fce4ec" opacity="0.9"/>
          <circle cx="-19" cy="-6" r="18" fill="#f8bbd0" opacity="0.9"/>
          <circle cx="0" cy="0" r="8" fill="#ffd54f"/>
        </g>
      </svg>
    </div>
    <div class="corner-floral bottom-right">
      <svg viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 180 C40 120, 90 60, 190 20" stroke="#88b06a" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
        <path d="M45 135 C20 110, 15 80, 40 70 C60 85, 60 115, 45 135 Z" fill="#a3c585" opacity="0.5"/>
        <path d="M95 85 C115 60, 145 55, 155 75 C140 95, 115 95, 95 85 Z" fill="#8fb973" opacity="0.5"/>
        <g transform="translate(65, 65)">
          <circle cx="0" cy="-22" r="20" fill="#f8bbd0" opacity="0.85"/>
          <circle cx="21" cy="-7" r="20" fill="#f48fb1" opacity="0.85"/>
          <circle cx="13" cy="18" r="20" fill="#f8bbd0" opacity="0.85"/>
          <circle cx="-13" cy="18" r="20" fill="#f48fb1" opacity="0.85"/>
          <circle cx="-21" cy="-7" r="20" fill="#fce4ec" opacity="0.9"/>
          <circle cx="0" cy="0" r="10" fill="#ffe082"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- Không gian 3D trung tâm chứa cuốn sổ -->
  <main class="stage-wrapper" id="stageWrapper">
    <div class="book-scene" id="bookScene">

      <!-- CUỐN SỔ 3D DUY NHẤT (Giữ nguyên khối 3D nghiêng cho cả bìa lẫn mọi lần lật trang) -->
      <div class="book-3d-float" id="book3DFloat">
        <div class="book-cover-3d" id="book3D" role="button" tabindex="0" aria-label="Nhấn vào giữa sổ để mở và lật từng trang">
          <!-- Gáy sách 3D bên trái -->
          <div class="cover-spine"></div>
          <!-- Độ dày xấp giấy 3D bên phải -->
          <div class="cover-pages-edge"></div>
          <!-- Độ dày xấp giấy 3D cạnh dưới -->
          <div class="cover-bottom-edge"></div>
          <!-- Mặt bìa sau 3D tạo chiều sâu -->
          <div class="cover-back"></div>

          <!-- TRANG NẰM DƯỚI (Hiện ra ngay bên dưới trong lúc tờ trên đang lật mở 3D) -->
          <div class="book-sheet under-sheet" id="underSheet">
            <div class="cover-shine"></div>
            <div class="cover-gold-corner tl"></div>
            <div class="cover-gold-corner tr"></div>
            <div class="cover-gold-corner bl"></div>
            <div class="cover-gold-corner br"></div>
            <div class="under-sheet-shadow" id="underSheetShadow"></div>
            <div class="cover-inner-frame" id="underSheetContent"></div>
          </div>

          <!-- TRANG ĐANG HIỂN THỊ TRÊN CÙNG (Xoay mở 3D quanh gáy trái mỗi lần nhấn) -->
          <div class="book-sheet top-sheet" id="topSheet">
            <!-- Mặt trước của tờ đang lật -->
            <div class="sheet-face sheet-front" id="topSheetFront">
              <div class="cover-shine"></div>
              <div class="cover-gold-corner tl"></div>
              <div class="cover-gold-corner tr"></div>
              <div class="cover-gold-corner bl"></div>
              <div class="cover-gold-corner br"></div>
              <div class="cover-inner-frame" id="topSheetContent"></div>
            </div>

            <!-- Mặt sau 3D của tờ giấy khi lật mở sang trái -->
            <div class="sheet-face sheet-back">
              <div class="sheet-back-pattern">
                <span class="sheet-back-emblem">🌸 TU1E • 20/11 🌸</span>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
